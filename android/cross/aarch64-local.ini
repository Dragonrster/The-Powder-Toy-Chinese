[constants]
android_ndk_bin = '/opt/android-sdk/ndk/mini-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'

[properties]
# 必须与 tpt-libs 预编译包内 meson.build 中的值完全一致，否则 meson.build 报 mismatch
android_ndk_toolchain_prefix = 'aarch64-linux-android21-'
android_platform = 'android-31'
# 环境只装了 android-33 的 platform，编译期 API 向下兼容，路径可用 33
android_platform_jar = '/opt/android-sdk/platforms/android-33/android.jar'
java_runtime_jar = '/usr/lib/jvm/java-17-openjdk-arm64/lib/jrt-fs.jar'

[built-in options]
# 系统 clang-18 的 driver 对 android target 不会自动链接 libm，手动补上
# 官方 so 静态链接 libc++；这里同样静态链接，避免 apk 缺少 libc++_shared.so 导致 dlopen 失败
cpp_link_args = ['-lm', '-static-libstdc++', '-static-libgcc', '-Wl,-Bstatic', '-lc++', '-Wl,-Bdynamic']
c_link_args = ['-lm']

[binaries]
cpp = android_ndk_bin / 'aarch64-linux-android21-clang++'
c = android_ndk_bin / 'aarch64-linux-android21-clang'
ar = android_ndk_bin / 'llvm-ar-18'
strip = android_ndk_bin / 'llvm-strip-18'
javac = '/usr/bin/javac'
jar = '/usr/bin/jar'
d8 = '/opt/android-sdk/build-tools/33.0.0/d8'
aapt = '/opt/android-sdk/build-tools/33.0.0/aapt'
aapt2 = '/opt/android-sdk/build-tools/33.0.0/aapt2'
zipalign = '/opt/android-sdk/build-tools/33.0.0/zipalign'
apksigner = '/opt/android-sdk/build-tools/33.0.0/apksigner'